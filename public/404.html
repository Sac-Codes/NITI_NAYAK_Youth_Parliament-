<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NITI NAYAK Youth Summit</title>
  <script>
    // Single Page App redirect for GitHub Pages
    // Converts the path into a query parameter so the main index.html can route it
    var pathSegmentsToKeep = 1; // keep /NITI_NAYAK_Youth_Parliament-/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
